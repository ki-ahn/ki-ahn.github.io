<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Book Reader</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="github.js"></script>
<script src="study.js"></script>
<script src="bible.js"></script>
<style>
/* ══════════════════════════════════════
   전역 테마 변수 — 라이트(기본) / 다크
══════════════════════════════════════ */
:root {
  /* 공통 UI (탭바·단어공부·설정모달) */
  --ui-bg:      #ffffff;
  --ui-bg2:     #f4f4f6;
  --ui-bg3:     #e8e8ec;
  --ui-border:  #d0d0d8;
  --ui-text:    #1a1a2e;
  --ui-text2:   #5a5a78;
  --ui-text3:   #9090a8;
  --ui-accent:  #5a7ef0;
  --ui-accent2: #3d9970;
  --ui-accent3: #e07820;
  --ui-danger:  #d03030;
  --r: 10px;
  /* 책보기 테마 */
  --pb: #f5f0e8;
  --paper: #fdfaf4;
  --ps: #ddd0b8;
  --pt: #1e1608;
  --pm: #6a5a3a;
  --pbd: #ccc0a0;
  --ac: #b8943a;
  --ac2: #7a5c10;
}
html[data-dark] {
  --ui-bg:      #0f1117;
  --ui-bg2:     #1a1d27;
  --ui-bg3:     #22263a;
  --ui-border:  #2e3350;
  --ui-text:    #e8eaf0;
  --ui-text2:   #8b90aa;
  --ui-text3:   #5a5f78;
  --ui-accent:  #e8a040;
  --ui-accent2: #4fa3e0;
  --ui-accent3: #7dd3a8;
  --ui-danger:  #e05555;
  --pb: #111008;
  --paper: #1c1810;
  --ps: #2e2818;
  --pt: #e8dfc8;
  --pm: #9a8a6a;
  --pbd: #302818;
  --ac: #c4a45a;
  --ac2: #a08030;
}

/* ══ 리셋 ══ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Noto Sans KR", sans-serif;
  background: var(--ui-bg); color: var(--ui-text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .2s, color .2s;
}

/* ══ 탭바 ══ */
#main-tabs {
  display: flex; align-items: center;
  background: var(--ui-bg2); border-bottom: 1px solid var(--ui-border);
  padding: 0 10px; gap: 2px; position: sticky; top: 0; z-index: 100;
}
.main-tab {
  padding: 13px 16px; font-size: 13px; font-weight: 500;
  color: var(--ui-text2); cursor: pointer;
  border-bottom: 2px solid transparent; transition: all .18s; white-space: nowrap;
}
.main-tab.on { color: var(--ui-accent); border-bottom-color: var(--ui-accent); }
.main-tab:hover:not(.on) { color: var(--ui-text); }
#tabs-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.tab-icon-btn {
  background: none; border: 1px solid var(--ui-border);
  color: var(--ui-text2); border-radius: 6px; padding: 5px 10px;
  font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px;
  transition: all .15s; white-space: nowrap;
}
.tab-icon-btn:hover { color: var(--ui-text); border-color: var(--ui-text2); }
.tab-icon-btn.active { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }

/* 다크모드 토글 버튼 */
#dark-toggle {
  width: 38px; height: 22px; border-radius: 11px;
  background: var(--ui-bg3); border: 1px solid var(--ui-border);
  cursor: pointer; position: relative; transition: background .2s; flex-shrink: 0;
}
html[data-dark] #dark-toggle { background: var(--ui-accent); border-color: var(--ui-accent); }
#dark-toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
html[data-dark] #dark-toggle::after { left: 18px; }
#dark-label { font-size: 11px; color: var(--ui-text2); }

.panel { display: none; }
.panel.on { display: block; }

/* ══ 토스트 ══ */
#toast {
  position: fixed; bottom: 22px; right: 22px;
  background: var(--ui-bg2); border: 1px solid var(--ui-border);
  border-radius: 8px; padding: 9px 15px; font-size: 13px; color: var(--ui-text);
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
  transform: translateY(80px); opacity: 0; transition: all .28s;
  z-index: 9999; max-width: 300px;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.ok  { border-color: var(--ui-accent3); color: var(--ui-accent3); }
#toast.err { border-color: var(--ui-danger);  color: var(--ui-danger); }

/* ══ 단어장 테이블 스타일 ══ */
:root { var-word-fs: 17px; }
#bk-reader table.word-table { width: 100%; border-collapse: collapse; margin: .5em 0; }
#bk-reader table.word-table td {
  padding: 8px 12px; border: 1px solid var(--pbd);
  font-size: var(--word-fs); vertical-align: middle;
  transition: filter .15s, opacity .15s;
}
#bk-reader table.word-table tr:hover { background: rgba(128,100,50,.04); }
#bk-reader table.word-table td.w-lao {
  font-family: "Noto Sans Lao", Georgia, serif;
  color: var(--ac); font-weight: 700;
  font-size: calc(var(--word-fs) + 2px);
}
#bk-reader table.word-table td.w-eng { color: var(--ac2); }
#bk-reader table.word-table td.w-kor { color: var(--pt); }
#bk-reader table.word-table td.vis-hidden {
  filter: blur(6px); cursor: pointer; user-select: none;
}
#bk-reader table.word-table td.vis-hidden:hover { filter: blur(3px); }
/* 찾기 버튼 */
.w-lookup-btn {
  background: none; border: 1px solid var(--pbd); border-radius: 4px;
  padding: 1px 6px; font-size: 10px; color: var(--pm); cursor: pointer;
  margin-right: 4px; transition: all .12s; vertical-align: middle;
  white-space: nowrap;
}
.w-lookup-btn:hover { background: var(--ac); color: #fff; border-color: var(--ac2); }

/* topbar 토글 버튼 */
.tog-btn {
  padding: 3px 10px; border-radius: 16px; font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--ui-border);
  background: var(--ui-bg3); color: var(--ui-text2);
  transition: all .13s; white-space: nowrap;
}
.tog-btn.on { background: var(--ui-accent2); color: #fff; border-color: var(--ui-accent2); }
.tog-btn:hover:not(.on) { border-color: var(--ui-text2); color: var(--ui-text); }

/* 사전 팝업 */
#bk-dict-popup {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 700;
  align-items: center; justify-content: center; padding: 20px;
}
#bk-dict-popup.open { display: flex; }
#bk-dict-content {
  background: var(--paper); border: 1px solid var(--pbd);
  border-radius: 12px; width: min(500px, 92vw);
  max-height: 70vh; display: flex; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,.25); overflow: hidden;
}
#bk-dict-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--pbd);
  font-family: "Noto Sans Lao", serif; font-size: 20px;
  color: var(--ac); font-weight: 700; flex-shrink: 0;
}
#bk-dict-header button {
  background: none; border: none; color: var(--pm);
  font-size: 18px; cursor: pointer; padding: 0 4px;
}
#bk-dict-body {
  overflow-y: auto; padding: 14px 16px;
  font-size: 14px; line-height: 1.8; color: var(--pt);
  -webkit-overflow-scrolling: touch;
}
.bk-tag {
  color: #7c6cfc !important;
  background: rgba(124,108,252,.10);
  border-radius: 4px; padding: 1px 5px; font-size: .88em;
  text-decoration: none !important; font-family: -apple-system, sans-serif;
  white-space: nowrap; cursor: default;
}
html[data-dark] .bk-tag { color: #a99cff !important; background: rgba(124,108,252,.15); }

/* ══ 통합 설정 모달 ══ */
#cfg-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 500;
  align-items: flex-start; justify-content: center;
  padding: 12px 12px 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#cfg-overlay.open { display: flex; }
#cfg-box {
  background: var(--ui-bg); border: 1px solid var(--ui-border);
  border-radius: 14px; width: 100%; max-width: 480px;
  box-shadow: 0 8px 36px rgba(0,0,0,.35);
  display: flex; flex-direction: column; margin: auto;
}
#cfg-tabs { display: flex; border-bottom: 1px solid var(--ui-border); flex-shrink: 0; }
.cfg-tab {
  flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600;
  color: var(--ui-text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s;
}
.cfg-tab.on { color: var(--ui-accent); border-bottom-color: var(--ui-accent); }
.cfg-pane { display: none; overflow-y: auto; padding: 20px 24px; max-height: 60vh; -webkit-overflow-scrolling: touch; }
.cfg-pane.on { display: block; }
.cfg-label { display: block; font-size: 11px; color: var(--ui-text2); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
.cfg-input {
  width: 100%; background: var(--ui-bg2); border: 1px solid var(--ui-border);
  color: var(--ui-text); padding: 10px 11px; border-radius: 7px;
  font-size: 16px; font-family: monospace;
}
.cfg-input:focus { outline: 2px solid var(--ui-accent2); border-color: var(--ui-accent2); }
.cfg-hint { font-size: 11px; color: var(--ui-text3); margin-top: 5px; line-height: 1.5; }
.cfg-row { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-shrink: 0; padding: 0 24px 20px; }
.btn-ok { padding: 8px 20px; background: var(--ui-accent); color: #fff; border: none; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-cancel { padding: 8px 14px; background: transparent; color: var(--ui-text2); border: 1px solid var(--ui-border); border-radius: 7px; font-size: 13px; cursor: pointer; }
.cfg-setr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cfg-setl { font-size: 13px; color: var(--ui-text); }
.cfg-fsb { display: flex; gap: 4px; }
.cfg-fsbtn {
  background: var(--ui-bg2); border: 1px solid var(--ui-border); border-radius: 5px;
  padding: 4px 9px; font-size: 11px; cursor: pointer; color: var(--ui-text2);
}
.cfg-fsbtn.on { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }
.cfg-secs { font-size: 11px; font-weight: 700; color: var(--ui-text2); text-transform: uppercase; letter-spacing: .7px; margin: 14px 0 6px; border-top: 1px solid var(--ui-border); padding-top: 12px; }
.cfg-vcbs { display: flex; flex-wrap: wrap; gap: 6px; }
.cfg-vcb { font-size: 12px; color: var(--ui-text2); display: flex; align-items: center; gap: 4px; cursor: pointer; }
.cfg-vcb input { accent-color: var(--ui-accent); }
.cfg-reset { width: 100%; background: var(--ui-bg2); border: 1px solid var(--ui-border); border-radius: 7px; padding: 8px; font-size: 12px; cursor: pointer; color: var(--ui-text2); margin-top: 12px; }
.cfg-reset:hover { background: var(--ui-danger); border-color: var(--ui-danger); color: #fff; }
.cfg-divider { border: none; border-top: 1px solid var(--ui-border); margin: 16px 0; }

/* ══════════════════════════════════════
   책보기 패널
══════════════════════════════════════ */
#panel-book { height: calc(100vh - 48px); display: none; flex-direction: column; overflow: hidden; }
#panel-book.on { display: flex; }
#book-wrap {
  flex: 1; overflow: hidden; display: flex; height: 100%;
  background: var(--pb); color: var(--pt); transition: background .2s, color .2s;
}
#bk-main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
#bk-topbar {
  background: var(--paper); border-bottom: 1px solid var(--pbd);
  padding: 0 10px; height: 44px; display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  transition: background .2s;
}
.bk-btn {
  background: none; border: 1px solid var(--pbd); color: var(--pm);
  border-radius: 5px; padding: 3px 8px; font-size: 12px; cursor: pointer;
  white-space: nowrap; transition: all .12s; display: flex; align-items: center; gap: 3px;
}
.bk-btn:hover { background: var(--pb); color: var(--pt); }
.bk-btn.on { background: var(--ac); color: #fff; border-color: var(--ac2); }
#bk-title { flex: 1; font-size: 12px; color: var(--pm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#bk-title strong { color: var(--pt); }
#bk-width-wrap { display: flex; align-items: center; gap: 5px; padding: 0 3px; }
#bk-width-wrap label { font-size: 10px; color: var(--pm); white-space: nowrap; }
#bk-width-sl { width: 64px; accent-color: var(--ac); cursor: pointer; }

/* 사이드바 */
#bk-sidebar {
  width: 260px; min-width: 100px; max-width: 460px;
  background: var(--sb-bg); display: none; flex-direction: column;
  height: 100%; overflow: hidden; flex-shrink: 0; border-right: 1px solid var(--sb-bdr);
}
html:not([data-dark]) #bk-sidebar {
  --sb-bg:    #f0ece4; --sb-bg2:   #e4dfd5; --sb-bg3:   #d8d0c4;
  --sb-text:  #2c2010; --sb-text2: #7a6a50; --sb-acc:   #8a6010; --sb-bdr:   #d0c8b8;
}
html[data-dark] #bk-sidebar {
  --sb-bg:    #0e0c08; --sb-bg2:   #1a1610; --sb-bg3:   #252018;
  --sb-text:  #c8c2b4; --sb-text2: #6a5a40; --sb-acc:   #c4a45a; --sb-bdr:   #1e1a12;
}
#bk-sidebar.open { display: flex; }
.bk-sbh { padding: 11px 11px 8px; border-bottom: 1px solid var(--sb-bdr); flex-shrink: 0; }
.bk-sbh h1 { color: var(--sb-acc); font-size: 14px; font-weight: 600; }
.bk-sbh p  { color: var(--sb-text2); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-sbs { padding: 6px 10px; border-bottom: 1px solid var(--sb-bdr); flex-shrink: 0; }
.bk-sbs input { width: 100%; background: var(--sb-bg2); border: 1px solid var(--sb-bg3); color: var(--sb-text); border-radius: 5px; padding: 4px 8px; font-size: 12px; outline: none; }
#bk-ftree { flex: 1; overflow-y: auto; padding: 4px 0; }
.bk-tf { cursor: pointer; padding: 5px 10px; color: var(--sb-acc); font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; user-select: none; }
.bk-tf:hover { background: var(--sb-bg2); }
.bk-tf .arr { font-size: 9px; transition: transform .2s; color: var(--sb-text2); }
.bk-tf.open .arr { transform: rotate(90deg); }
.bk-tc { display: none; } .bk-tc.open { display: block; }
.bk-fi { padding: 4px 10px 4px 22px; color: var(--sb-text); font-size: 13px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background .1s; }
.bk-fi:hover { background: var(--sb-bg2); }
.bk-fi.active { background: var(--sb-bg3); color: var(--sb-acc); }
.bk-sbf { padding: 7px 10px; border-top: 1px solid var(--sb-bdr); flex-shrink: 0; display: flex; gap: 5px; }
.bk-sbb { flex: 1; background: var(--sb-bg2); border: 1px solid var(--sb-bg3); color: var(--sb-text); border-radius: 5px; padding: 5px; font-size: 11px; cursor: pointer; text-align: center; }

/* splitter & content */
.bk-spl { width: 4px; flex-shrink: 0; cursor: col-resize; background: transparent; transition: background .15s; }
.bk-spl:hover, .bk-spl.drag { background: var(--ac); }
#bk-content { flex: 1; display: flex; overflow: hidden; }
#bk-rw { flex: 1; overflow-y: auto; padding: 28px 0; background: var(--pb); min-width: 180px; }
#bk-reader {
  max-width: 740px; margin: 0 auto; background: var(--paper); border-radius: 4px;
  box-shadow: 0 2px 20px rgba(0,0,0,.1); padding: 48px 60px;
  line-height: 1.85; color: var(--pt); font-size: 17px;
  word-break: normal; overflow-wrap: break-word; transition: background .2s;
}
@media(max-width:820px) { #bk-reader { padding: 28px 16px; font-size: 16px; } }

#bk-toc { background: var(--paper); border-left: 1px solid var(--pbd); overflow-y: auto; padding: 13px 9px; flex-shrink: 0; display: none; width: 190px; }
#bk-toc.open { display: block; }
.bk-ti { display: block; color: var(--pm); font-size: 11px; padding: 3px 0 3px 6px; cursor: pointer; }
.hl { cursor: pointer; border-radius: 2px; }
.hl-yellow { background: rgba(255,220,80,.5); }
.hl-green  { background: rgba(100,200,120,.4); }
.hl-blue   { background: rgba(80,160,255,.4); }
.hl-pink   { background: rgba(255,100,150,.4); }

#bk-hlpop {
  position: fixed; background: var(--paper); border: 1px solid var(--pbd);
  border-radius: 10px; padding: 8px 10px; box-shadow: 0 6px 22px rgba(0,0,0,.2);
  display: none; z-index: 700; gap: 8px; align-items: center; min-width: 200px;
}
#bk-hlpop.show { display: flex; }
.bk-hlpop-colors { display: flex; gap: 6px; }
.bk-hlpop-c { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
.bk-hlpop-btn { background: none; border: 1px solid var(--pbd); border-radius: 6px; padding: 3px 9px; font-size: 11px; color: var(--pm); cursor: pointer; }

#bk-annot { position: fixed; top: 96px; right: 14px; background: var(--paper); border: 1px solid var(--pbd); border-radius: 10px; width: 310px; max-height: 480px; box-shadow: 0 8px 28px rgba(0,0,0,.18); display: none; flex-direction: column; z-index: 400; }
#bk-annot.open { display: flex; }
.bk-an-hd { padding: 9px 13px; border-bottom: 1px solid var(--pbd); font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; color: var(--pt); }
#bk-an-list { overflow-y: auto; flex: 1; }
.bk-an-item { padding: 8px 13px; border-bottom: 1px solid var(--pbd); cursor: pointer; }

#bk-search-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 399; }
#bk-search-overlay.open { display: block; }
#bk-search { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -54%); background: var(--paper); border: 1px solid var(--pbd); border-radius: 12px; width: min(480px, 92vw); max-height: 60vh; display: none; flex-direction: column; z-index: 400; overflow: hidden; }
#bk-search.open { display: flex; }
.bk-sw { display: flex; align-items: center; border-bottom: 1px solid var(--pbd); }
#bk-sinp { flex: 1; border: none; padding: 12px 6px; font-size: 14px; outline: none; background: transparent; color: var(--pt); }
#bk-sres { overflow-y: auto; flex: 1; }
.bk-sri { padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--pbd); }
.bk-sre mark { background: rgba(255,220,80,.55); color: #1e1608; }
#bk-prog { height: 2px; background: var(--ac); position: fixed; top: 0; left: 0; z-index: 999; transition: width .15s; pointer-events: none; }
.bk-spin { text-align: center; padding: 48px; color: var(--pm); font-size: 14px; }

/* ══════════════════════════════════════
   PDF 패널
══════════════════════════════════════ */
#panel-pdf { height: calc(100vh - 48px); display: none; flex-direction: column; overflow: hidden; }
#panel-pdf.on { display: flex; }
#pdf-wrap { flex: 1; display: flex; overflow: hidden; height: 100%; background: var(--ui-bg); }
#pdf-sidebar { width: 240px; min-width: 80px; max-width: 400px; background: var(--sb-bg); display: flex; flex-direction: column; height: 100%; overflow: hidden; border-right: 1px solid var(--sb-bdr); }
#pdf-ftree { flex: 1; overflow-y: auto; padding: 4px 0; }
#pdf-viewer-col { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
#pdf-topbar { background: var(--paper); border-bottom: 1px solid var(--pbd); padding: 0 10px; height: 44px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#pdf-title { flex: 1; font-size: 12px; color: var(--pm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pdf-viewer-wrap { flex: 1; overflow: hidden; position: relative; background: var(--ui-bg2); }
#pdf-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ui-text3); text-align: center; padding: 24px; }
#pdf-iframe { width: 100%; height: 100%; border: none; display: none; background: var(--ui-bg); }
</style>
</head>
<body>

<div id="bk-prog" style="width:0"></div>
<div id="toast"></div>

<!-- ══ 통합 설정 모달 ══ -->
<div id="cfg-overlay">
  <div id="cfg-box">
    <div id="cfg-tabs">
      <div class="cfg-tab on" onclick="switchCfgTab('github',this)">🔑 GitHub</div>
      <div class="cfg-tab" onclick="switchCfgTab('reader',this)">📖 책보기</div>
    </div>
    <!-- GitHub 탭 -->
    <div class="cfg-pane on" id="cfgp-github">

<script>
/* ══ AppToast & 핵심 기본 변수 ══ */
const AppToast = {
  _t: null,
  show(msg, type='') {
    const el = document.getElementById('toast'); if(!el) return;
    el.textContent = msg; el.className = 'toast show' + (type==='success' ? ' ok' : type==='error' ? ' err' : '');
    clearTimeout(this._t); this._t = setTimeout(() => el.classList.remove('show'), 3200);
  }
};

function applyDark(on) {
  document.documentElement.dataset.dark = on ? '1' : '';
  if (!on) delete document.documentElement.dataset.dark;
  if (window.BibleModule?.setDark) BibleModule.setDark(on);
}
function toggleDark() {
  const isDark = !document.documentElement.hasAttribute('data-dark');
  applyDark(isDark); _bkS.dark = isDark; bkSaveStore();
}
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('on'));
  document.getElementById('panel-' + name)?.classList.add('on');
  document.getElementById('tab-' + name)?.classList.add('on');
}

/* 설정 관리 — 수정 및 보완 완료 */
function openCfg() {
  // GitHubModule에 저장된 값이 없으면 _bkS 환경변수나 로컬스토리지에서 복원 시도
  const c = GitHubModule.get() || {};
  document.getElementById('cfg-user').value = c.user || _bkS.github_user || '';
  document.getElementById('cfg-repo').value = c.repo || _bkS.github_repo || '';
  document.getElementById('cfg-branch').value = c.branch || _bkS.github_branch || 'main';
  document.getElementById('cfg-bible').value = _bkS.bible_folder || 'Bible';
  document.getElementById('cfg-token').value = c.token || _bkS.github_token || '';
  document.getElementById('cfg-root').value = c.rootFolder || _bkS.github_root || 'Notes';
  
  document.getElementById('cfg-overlay').classList.add('open');
}

function closeCfg() { 
  document.getElementById('cfg-overlay').classList.remove('open'); 
}

function saveCfg() {
  const user = document.getElementById('cfg-user').value.trim();
  const repo = document.getElementById('cfg-repo').value.trim();
  const branch = document.getElementById('cfg-branch').value.trim() || 'main';
  const bible = document.getElementById('cfg-bible').value.trim() || 'Bible';
  const token = document.getElementById('cfg-token').value.trim();
  const rootFolder = document.getElementById('cfg-root').value.trim();

  if(!user || !repo) {
    AppToast.show('사용자명과 저장소 이름은 필수입니다.', 'error');
    return;
  }

  // 1. GitHub 모듈 메모리에 반영
  GitHubModule.configure({ user, repo, branch, token, rootFolder });

  // 2. 통합 환경 변수(_bkS)에 영구 저장을 위한 값 할당
  _bkS.github_user = user;
  _bkS.github_repo = repo;
  _bkS.github_branch = branch;
  _bkS.github_token = token;
  _bkS.github_root = rootFolder;
  _bkS.bible_folder = bible;

  // 3. 브라우저 로컬 스토리지에 즉시 강제 영구 저장
  bkSaveStore();

  AppToast.show('설정이 브라우저에 안전하게 저장되었습니다.', 'success');
  closeCfg();
  
  // 4. 저장 직후 파일 목록 새로고침 작동
  bkLoadFiles();
}

/* 초기 로드 기동 시 저장된 설정 강제 복원 기능 추가 */
window.addEventListener('DOMContentLoaded', () => {
  bkLoadStore();
  
  // 브라우저가 켜질 때 로컬스토리지 복원값이 있으면 GitHub 모듈에 자동 주입
  if (_bkS.github_user && _bkS.github_repo) {
    GitHubModule.configure({
      user: _bkS.github_user,
      repo: _bkS.github_repo,
      branch: _bkS.github_branch || 'main',
      token: _bkS.github_token || '',
      rootFolder: _bkS.github_root || 'Notes'
    });
    
    // UI 레이블 업데이트
    const lbl = document.getElementById('bk-repo-lbl');
    if(lbl) lbl.textContent = `${_bkS.github_user} / ${_bkS.github_repo}`;
  }

  // 다크모드 설정값 유지 반영
  if (_bkS.dark) {
    applyDark(true);
  }

  bkLoadFiles();
});

/* ══════════════════════════════════════
   [핵심 수정] 단어장 기능 탐지 및 뷰어 연동
══════════════════════════════════════ */
let _wColVis = { lao: true, eng: true, kor: true };
let _wFontSize = 17;

// 파일명이나 텍스트 첫 행 구조를 기반으로 단어장 여부 확인
function bkIsWordFile(path, text = "") {
  if (path && (path.toLowerCase().includes('word') || path.toLowerCase().includes('lao'))) return true;
  if (text) {
    const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length > 0);
    if(lines.length >= 2 && lines[0].startsWith('|') && lines[1].startsWith('|')) return true;
  }
  return false;
}

// 단어장 마크다운 테이블 빌더
function bkRenderWordTable(text) {
  const lines = text.split('\n');
  let html = `<table class="word-table" id="bk-word-table">`;
  let rowCount = 0;

  lines.forEach(line => {
    const t = line.trim();
    if (!t.startsWith('|')) return;
    if (/^\|[-:\s|]+\|$/.test(t)) return; // 마크다운 가로 구분선 스킵

    const cells = t.split('|').slice(1, -1).map(c => c.trim());
    if (cells.length < 2) return;

    // 헤더 행 제외 처리 (라오어/영어/한글 타이틀 스킵)
    if (cells.some(c => /라오|Lao|영어|Eng|한글|Kor/i.test(c)) && rowCount === 0) return;

    rowCount++;
    const lao = cells[0] || '';
    const eng = cells[1] || '';
    const kor = cells[2] || '';

    // 상단 토글 및 개별 숨김 처리가 가능한 테이블 바인딩
    html += `<tr>
      <td class="w-lao ${!_wColVis.lao ? 'vis-hidden' : ''}" data-col="lao" onclick="wTogCell(this)">
        <button class="w-lookup-btn" onclick="event.stopPropagation(); bkDictLookup('${lao.replace(/'/g, "\\'")}')">🔍</button>
        <span>${lao}</span>
      </td>
      <td class="w-eng ${!_wColVis.eng ? 'vis-hidden' : ''}" data-col="eng" onclick="wTogCell(this)">${eng}</td>
      <td class="w-kor ${!_wColVis.kor ? 'vis-hidden' : ''}" data-col="kor" onclick="wTogCell(this)">${kor}</td>
    </tr>`;
  });

  html += `</table>`;
  return rowCount > 0 ? html : null;
}

// 단어장 전용 열 전체 보이기/감추기 토글
function wTogCol(col) {
  _wColVis[col] = !_wColVis[col];
  const btn = document.getElementById('wctrl-' + col);
  if(btn) btn.classList.toggle('on', _wColVis[col]);

  const tds = document.querySelectorAll(`#bk-word-table td[data-col="${col}"]`);
  tds.forEach(td => {
    td.classList.toggle('vis-hidden', !_wColVis[col]);
  });
}

// 개별 셀 클릭 시 블러 효과 토글
function wTogCell(td) {
  td.classList.toggle('vis-hidden');
}

// 단어장 전용 글자 크기 조절 기능
function wFontSize(dir) {
  _wFontSize = Math.max(12, Math.min(36, _wFontSize + dir * 2));
  localStorage.setItem('word-fs', _wFontSize);
  const table = document.getElementById('bk-word-table');
  if(table) {
    table.style.setProperty('--word-fs', _wFontSize + 'px');
  }
}

// 단어장 내 검색 팝업 바인딩
function bkDictLookup(word) {
  if(!word) return;
  document.getElementById('bk-dict-word').textContent = word;
  const body = document.getElementById('bk-dict-body');
  body.innerHTML = `<div class="bk-spin">사전 검색 중…</div>`;
  document.getElementById('bk-dict-popup').classList.add('open');
  
  // 외부 사전 연동 목적 아이프레임 또는 네이버 검색 대체 링크 제공
  body.innerHTML = `
    <div style="text-align:center; padding:10px;">
      <p style="margin-bottom:12px;">네이버 사전에서 안전하게 단어를 확인하세요.</p>
      <a href="https://dict.naver.com/search.dict?query=${encodeURIComponent(word)}" target="_blank" class="btn-ok" style="text-decoration:none; display:inline-block;">네이버 사전 열기 ↗</a>
    </div>`;
}
function bkHideDictPopup() { document.getElementById('bk-dict-popup').classList.remove('open'); }


/* ══════════════════════════════════════
   기존 파일 핸들러 및 원본 연동 최적화
══════════════════════════════════════ */
const BIBLE_VERSIONS = ['개역개정', '새번역', 'ESV', 'NIV', 'LAO'];
const _bkS = { dark: false, fs: 19, vers: ['개역개정', 'ESV'], readerW: 740 };
let _bkFiles = [], _bkCur = null, _bkContent = '';
let _bkHls = {}, _bkPos = {}; let _bkDrag = null;

function bkLoadStore() {
  try {
    const c = localStorage.getItem('obr-cfg'); if (c) Object.assign(_bkS, JSON.parse(c));
    const h = localStorage.getItem('obr-hl');  if (h) _bkHls = JSON.parse(h);
    const p = localStorage.getItem('obr-pos'); if (p) _bkPos = JSON.parse(p);
  } catch(e) {}
}
function bkSaveStore() {
  localStorage.setItem('obr-cfg', JSON.stringify(_bkS));
  localStorage.setItem('obr-hl',  JSON.stringify(_bkHls));
  localStorage.setItem('obr-pos', JSON.stringify(_bkPos));
}

async function bkLoadFiles() {
  document.getElementById('bk-ftree').innerHTML = '<div class="bk-spin">로딩 중…</div>';
  try {
    const tree = await GitHubModule.fetchTree();
    _bkFiles = tree.tree.filter(f => f.type==='blob' && (f.path.endsWith('.md') || f.path.endsWith('.pdf'))).map(f => f.path);
    bkRenderTree(_bkFiles);
    
    const last = localStorage.getItem('bk-last-file');
    if (last && _bkFiles.includes(last)) bkOpen(last);
  } catch(e) {
    document.getElementById('bk-ftree').innerHTML = '저장소 에러';
  }
}

function bkRenderTree(files) {
  const tree = {};
  files.forEach(path => {
    const parts = path.split('/'); let node = tree;
    parts.forEach((p, i) => {
      if (i === parts.length - 1) { (node.__f__ = node.__f__ || []).push({name:p, path}); }
      else { node[p] = node[p] || {}; node = node[p]; }
    });
  });
  document.getElementById('bk-ftree').innerHTML = bkRNode(tree, 0);
}
function bkRNode(node, d) {
  let html = ''; const pad = 10 + d * 10;
  Object.keys(node).filter(k => k !== '__f__').sort().forEach(k => {
    html += `<div class="bk-tf" style="padding-left:${pad}px" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><span class="arr">▶</span>📁 ${k}</div><div class="bk-tc">${bkRNode(node[k], d+1)}</div>`;
  });
  (node.__f__ || []).forEach(f => {
    const isPdf = f.path.endsWith('.pdf');
    const name = f.name.replace(/\.(md|pdf)$/, '');
    const click = isPdf ? `switchTab('pdf'); pdfOpenFile('${f.path}')` : `bkOpen('${f.path}')`;
    html += `<div class="bk-fi" data-path="${f.path}" onclick="${click}">${isPdf?'📄':'📝'} ${name}</div>`;
  });
  return html;
}
function bkFilterTree(q) {
  q = q.toLowerCase();
  bkRenderTree(_bkFiles.filter(p => p.toLowerCase().includes(q)));
}

async function bkOpen(path) {
  _bkCur = path; localStorage.setItem('bk-last-file', path);
  document.querySelectorAll('.bk-fi').forEach(el => el.classList.remove('active'));
  const targetEl = document.querySelector(`.bk-fi[data-path="${CSS.escape(path)}"]`);
  if (targetEl) targetEl.classList.add('active');

  const reader = document.getElementById('bk-reader');
  reader.innerHTML = '<div class="bk-spin">불러오는 중…</div>';

  try {
    _bkContent = await GitHubModule.readFile(path);
    
    // 단어장 파일 분석 검증
    if (bkIsWordFile(path, _bkContent)) {
      document.getElementById('bk-word-ctrl').style.display = 'flex';
      document.getElementById('bk-width-wrap').style.display = 'none';
      document.getElementById('bk-tocbtn').style.display = 'none';
      document.getElementById('bk-annotbtn').style.display = 'none';

      _wFontSize = parseInt(localStorage.getItem('word-fs') || '17');
      const tblHtml = bkRenderWordTable(_bkContent);
      if(tblHtml) {
        reader.innerHTML = tblHtml;
        reader.style.setProperty('--word-fs', _wFontSize + 'px');
        return;
      }
    }

    // 일반 책마크다운 파일 렌더링 전환
    document.getElementById('bk-word-ctrl').style.display = 'none';
    document.getElementById('bk-width-wrap').style.display = 'flex';
    document.getElementById('bk-tocbtn').style.display = 'block';
    document.getElementById('bk-annotbtn').style.display = 'block';
    
    let html = marked.parse(_bkContent.replace(/^---[\s\S]*?---\n?/, ''));
    reader.innerHTML = html;
    reader.style.fontSize = _bkS.fs + 'px';
  } catch(e) {
    reader.innerHTML = '파일 오픈 에러';
  }
}

function bkRefresh() { bkLoadFiles(); }
function bkSetWidth(v) { document.getElementById('bk-reader').style.maxWidth = v + 'px'; }
function bkTogSidebar() { const sb = document.getElementById('bk-sidebar'); sb.style.display = sb.style.display==='flex'?'none':'flex'; }
function switchCfgTab(t,el) { document.querySelectorAll('.cfg-tab').forEach(x=>x.classList.remove('on')); el.classList.add('on'); document.querySelectorAll('.cfg-pane').forEach(p=>p.classList.remove('on')); document.getElementById('cfgp-'+t).classList.add('on'); }

/* 초기 로드 기동 */
window.addEventListener('DOMContentLoaded', () => {
  bkLoadStore();
  bkLoadFiles();
  // 불러오기 복원 스크립트 실행 생략 보존...
});
</script>
